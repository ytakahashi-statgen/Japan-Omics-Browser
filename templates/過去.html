
{% extends 'layout.html' %}

{% block body %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1>Hover over Points</h1>
                {{ html|safe }}
                <div class="col-xs-12 col-sm-8 col-md-6">
                    <input type="text" class="form-control" id="search" placeholder="Search... &quot;427.21&quot;, &quot;Diabetes&quot;, etc.">
                </div>
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            {% for h in table_data.header %}
                            <th>{{ h }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                            {% for d in table_data.data %}
                        <tr>
                            {% for v in d %}
                            <td>{{ v }}</td>
                            {% endfor %}
                        </tr>
                            {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

{% endblock %}
